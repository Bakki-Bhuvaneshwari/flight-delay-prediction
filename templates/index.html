<!DOCTYPE html>
<html>

<head>
    <title>Flight Delay Prediction</title>
</head>

<body>

    <h1>Flight Delay Prediction</h1>

    <form id="flightForm">

        <label>FL_DATE:</label><br>
        <input type="date" id="FL_DATE" required><br><br>

        <label>AIRLINE:</label><br>
        <input type="text" id="AIRLINE" placeholder="Example: AA" required><br><br>

        <label>ORIGIN:</label><br>
        <input type="text" id="ORIGIN" placeholder="Example: ATL" required><br><br>

        <label>DEST:</label><br>
        <input type="text" id="DEST" placeholder="Example: LAX" required><br><br>

        <label>DISTANCE:</label><br>
        <input type="number" id="DISTANCE" step="any" min="0" required><br><br>

        <label>DEPT_DELAY:</label><br>
        <input type="number" id="DEP_DELAY" step="any" required><br><br>

        <button type="submit" id="predictBtn">Predict</button>

    </form>

    <h2>Prediction Result</h2>

    <div id="output">
        Result will appear here.
    </div>

    <script>

        document.getElementById("flightForm").addEventListener("submit", async function (event) {

            event.preventDefault();

            const output = document.getElementById("output");
            const button = document.getElementById("predictBtn");

            const data = {
                FL_DATE: document.getElementById("FL_DATE").value,
                AIRLINE: document.getElementById("AIRLINE").value,
                ORIGIN: document.getElementById("ORIGIN").value,
                DEST: document.getElementById("DEST").value,
                DISTANCE: Number(document.getElementById("DISTANCE").value),
                DEP_DELAY: Number(document.getElementById("DEP_DELAY").value)
            };

            output.innerHTML = "Predicting...";
            button.disabled = true;

            try {

                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                console.log("API Response:", result);

                if (!response.ok) {
                    throw new Error(result.error || JSON.stringify(result));
                }

                output.innerHTML = `
                    <h3>Predicted Arrival Delay: ${result.predicted_arrival_delay} minutes</h3>
                    <p>${result.message}</p>
                    <p>Status: ${result.status}</p>
                `;

            }

            catch (error) {

                console.error("Prediction Error:", error);

                output.innerHTML = `
                    <h3>Prediction Failed</h3>
                    <p>Error: ${error.message}</p>
                `;

            }

            finally {
                button.disabled = false;
            }

        });

    </script>

</body>

</html>
